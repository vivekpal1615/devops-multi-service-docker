name: CI/CD - Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push NestJS Image
        uses: docker/build-push-action@v5
        with:
          context: ./devops-sample-nest
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nest-app:latest

      - name: Build and Push FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: ./devops-sample-fast
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastapi-app:latest
